name: Deploy feedback relay

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-feedback-relay-${{ github.repository }}-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Run tests
        run: npm test

      - name: Pull Vercel production settings
        run: npx --yes vercel@56.4.1 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build feedback relay
        run: npx --yes vercel@56.4.1 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy feedback relay
        run: npx --yes vercel@56.4.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
